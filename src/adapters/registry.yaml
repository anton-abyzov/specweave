---
# SpecWeave Adapter Registry
#
# Lists all available adapters for multi-tool support.
# CLI reads this file to show available adapters.
#
# DETECTION PRIORITY (Claude-first!):
# 1. Claude Code (FIRST! - active indicator, SpecWeave is native to Claude)
# 2. Cursor (only if Claude unavailable - passive indicator .cursor/)
# 3. Gemini CLI (only if Claude unavailable)
# 4. Codex (only if Claude unavailable)
# 5. Generic (only if explicitly requested via --adapter)
#
# Rationale: Claude CLI available = ACTIVE indicator (user installed it).
# .cursor/ directory = PASSIVE indicator (may exist from old usage).

version: 1
last_updated: 2025-12-05

adapters:
  - name: claude
    description: "Claude Code - NATIVE/BASELINE (no adapter needed!). Full automation with skills, agents, hooks"
    automation_level: full
    status: native
    directory: claude
    features:
      - Native skills, agents, hooks (no approximation needed)
      - Skills auto-activate (specweave-detector, skill-router, etc.)
      - Agents coordinate (PM, Architect, DevOps, QA, Security)
      - Hooks auto-update docs (post-task-completion, etc.)
      - Skills (/sw:increment, /sw:progress, /sw:done, etc.)
      - Best experience, most features - THE BASELINE!
    requirements:
      - Claude Code CLI installed
      - Node.js >= 18.0.0
    market_share: 10%
    priority: P0
    note: "Claude is the native experience - adapters exist to approximate these capabilities for other tools"

  - name: antigravity
    description: "Antigravity adapter - Semi-automation with AGENTS.md and agentic coding"
    automation_level: semi
    status: active
    directory: antigravity
    features:
      - AGENTS.md universal instructions
      - Google's Gemini-powered code agent
      - Agentic coding with file operations
      - MCP support for extensibility
      - Google Cloud ecosystem integration
    requirements:
      - Antigravity CLI installed
      - Node.js >= 18.0.0
    market_share: 15%
    priority: P1

  - name: cursor
    description: "Cursor adapter - Semi-automation with .cursorrules and @ shortcuts"
    automation_level: semi
    status: active
    directory: cursor
    features:
      - .cursorrules with SpecWeave workflow instructions
      - "@ context shortcuts (@increments, @docs, @strategy)"
      - Composer multi-file editing support
      - Good experience, semi-automated
    requirements:
      - Cursor editor installed
      - Node.js >= 18.0.0
    market_share: 30%
    priority: P1

  - name: copilot
    description: "GitHub Copilot adapter - Skills installed in .github/skills/"
    automation_level: basic
    status: active
    directory: copilot
    features:
      - .github/skills/<plugin>/<skill>/SKILL.md nested skill directories
      - Works with GitHub Copilot VS Code extension and IDE integrations
      - Skills auto-read as workspace instructions
    requirements:
      - GitHub Copilot extension (VS Code or JetBrains)
      - Node.js >= 18.0.0
    market_share: 35%
    priority: P1

  - name: generic
    description: "Generic adapter - Manual workflow for ANY AI tool (ChatGPT, Gemini, etc.)"
    automation_level: manual
    status: active
    directory: generic
    features:
      - SPECWEAVE.md with step-by-step manual instructions
      - Works with ANY AI (ChatGPT, Gemini, Claude web, etc.)
      - No automation, user guides AI through workflow
      - Basic experience, maximum compatibility (100%)
    requirements:
      - Node.js >= 18.0.0 (for CLI init only)
      - Any AI tool (web or local)
    market_share: 20%
    priority: P1

  - name: gemini
    description: "Gemini CLI adapter - Semi-automation with AGENTS.md and agent mode"
    automation_level: semi
    status: active
    directory: gemini
    features:
      - AGENTS.md universal instructions
      - 1M token context window (5x larger than Claude!)
      - Agent mode for multi-file tasks
      - MCP (Model Context Protocol) support
      - Free tier available (60 req/min, 1K req/day)
      - Open source (Apache 2.0)
    requirements:
      - Gemini CLI installed
      - Node.js >= 18.0.0
    market_share: 10%
    priority: P1

  - name: codex
    description: "OpenAI Codex adapter - Semi-automation with AGENTS.md and GPT-5-Codex"
    automation_level: semi
    status: active
    directory: codex
    features:
      - AGENTS.md universal instructions
      - GPT-5-Codex optimized for engineering
      - Multiple access points (CLI + Web + IDE + GitHub + iOS)
      - Task-based isolated execution
      - File operations and test execution
    requirements:
      - ChatGPT Plus/Pro/Business/Enterprise
      - Node.js >= 18.0.0
    market_share: 20%
    priority: P1

  - name: windsurf
    description: "Windsurf adapter - Skills installed in .windsurf/skills/"
    automation_level: semi
    status: active
    directory: windsurf
    features:
      - .windsurf/skills/*.md skill files auto-loaded by Windsurf
      - Semi-automation with AGENTS.md workflow instructions
    requirements:
      - Windsurf editor installed
      - Node.js >= 18.0.0
    market_share: 15%
    priority: P1

  - name: continue
    description: "Continue.dev adapter - Skills installed in .continue/skills/"
    automation_level: semi
    status: active
    directory: continue
    features:
      - .continue/skills/*.md skill files auto-loaded by Continue extension
      - Files loaded in lexicographic order
    requirements:
      - Continue.dev VS Code or JetBrains extension
      - Node.js >= 18.0.0
    market_share: 10%
    priority: P1

  - name: cline
    description: "Cline adapter - Skills installed in .cline/skills/"
    automation_level: semi
    status: active
    directory: cline
    features:
      - .cline/skills/*.md skill context files
      - Agentic task execution support
    requirements:
      - Cline VS Code extension
      - Node.js >= 18.0.0
    market_share: 10%
    priority: P1

  - name: opencode
    description: "OpenCode adapter - Skills installed in .opencode/skills/"
    automation_level: semi
    status: active
    directory: opencode
    features:
      - .opencode/skills/*.md skill files auto-loaded by OpenCode
      - MCP support for extensibility
      - CLI-based AI coding tool
    requirements:
      - OpenCode CLI installed
      - Node.js >= 18.0.0
    market_share: 5%
    priority: P2

  - name: zed
    description: "Zed adapter - Skills installed in .zed/skills/"
    automation_level: semi
    status: active
    directory: zed
    features:
      - .zed/skills/*.md project skill files auto-loaded by Zed AI
      - MCP support for extensibility
    requirements:
      - Zed editor installed
      - Node.js >= 18.0.0
    market_share: 5%
    priority: P2

  - name: amazonq
    description: "Amazon Q Developer adapter - Skills installed in .amazonq/skills/"
    automation_level: semi
    status: active
    directory: amazonq
    features:
      - .amazonq/skills/*.md files auto-loaded on startup
      - Enterprise-grade AI coding assistant
    requirements:
      - Amazon Q Developer extension or CLI
      - Node.js >= 18.0.0
    market_share: 5%
    priority: P2

  - name: jetbrains
    description: "JetBrains Junie adapter - Skills installed in .junie/skills/"
    automation_level: semi
    status: active
    directory: jetbrains
    features:
      - .junie/skills/*.md skill files loaded by JetBrains Junie
      - Works with IntelliJ IDEA, WebStorm, PyCharm, etc.
    requirements:
      - JetBrains IDE with AI Assistant plugin
      - Node.js >= 18.0.0
    market_share: 10%
    priority: P2

  - name: aider
    description: "Aider adapter - Skills installed in .aider/skills/"
    automation_level: semi
    status: active
    directory: aider
    features:
      - .aider/skills/*.md skill context files
      - CLI-first AI coding assistant
    requirements:
      - Aider CLI installed (pip install aider-chat)
      - Node.js >= 18.0.0
    market_share: 5%
    priority: P2

  - name: tabnine
    description: "Tabnine adapter - Skills installed in .tabnine/skills/"
    automation_level: basic
    status: active
    directory: tabnine
    features:
      - .tabnine/skills/*.md custom skill files auto-loaded
      - Enterprise AI code completion
    requirements:
      - Tabnine extension (VS Code, JetBrains, etc.)
      - Node.js >= 18.0.0
    market_share: 5%
    priority: P2

  - name: kimi
    description: "Kimi CLI adapter - Skills installed in .kimi/skills/"
    automation_level: semi
    status: active
    directory: kimi
    features:
      - .kimi/skills/*.md skill files
      - Moonshot AI coding assistant
    requirements:
      - Kimi CLI installed
      - Node.js >= 18.0.0
    market_share: 5%
    priority: P2

  - name: trae
    description: "Trae adapter - Skills installed in .trae/skills/"
    automation_level: semi
    status: active
    directory: trae
    features:
      - .trae/skills/*.md skill files
      - ByteDance AI coding assistant
      - MCP support
    requirements:
      - Trae installed
      - Node.js >= 18.0.0
    market_share: 5%
    priority: P2

# Future adapters (P2/P3)
