<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:G;src:url(../assets/fonts/GeistSans.woff2);font-weight:100 900}
@font-face{font-family:M;src:url(../assets/fonts/GeistMono.woff2);font-weight:100 900}
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#0b0b0f;font-family:G}
.bg{position:absolute;inset:0;background:radial-gradient(800px 500px at 10% 0%,rgba(217,119,87,.35),transparent 60%),radial-gradient(700px 500px at 100% 100%,rgba(79,140,255,.22),transparent 60%),#0b0b0f}

.cmd{position:absolute;left:56px;bottom:46px;font:600 30px M;color:#c9c9d1}.cmd b{color:#22c55e}
</style></head><body><div class="bg"></div>
