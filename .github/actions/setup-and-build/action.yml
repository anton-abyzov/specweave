name: 'Setup and Build SpecWeave'
description: 'Install dependencies and build the TypeScript project'

inputs:
  node-version:
    description: 'Node.js version'
    required: false
    default: '22.x'
  skip-build:
    description: 'Skip the build step (just install deps)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Build project
      if: inputs.skip-build != 'true'
      shell: bash
      run: npm run rebuild
