name: 'Setup and Build SpecWeave'
description: 'Install dependencies and build the TypeScript project'

inputs:
  node-version:
    description: 'Node.js version'
    required: false
    default: '22.x'
  skip-build:
    description: 'Skip the build step (just install deps)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'

    # Supply-chain guard: dependency install scripts never run in CI.
    # `npm run setup` rebuilds only the allowlisted packages (see SECURITY.md).
    - name: Install dependencies (no install scripts)
      shell: bash
      run: npm ci --ignore-scripts

    - name: Rebuild allowlisted native deps
      shell: bash
      run: npm run setup

    - name: Build project
      if: inputs.skip-build != 'true'
      shell: bash
      run: npm run rebuild
