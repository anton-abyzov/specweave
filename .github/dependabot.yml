# Dependabot Configuration for SpecWeave
# Automated dependency updates for security and maintenance
# See: https://docs.github.com/en/code-security/dependabot
#
# Supply-chain policy (SECURITY.md): no auto-fix agents, no auto-merge.
# Required checks before a dependabot PR is merged by a human:
#   Supply-chain scan (supply-chain-scan.yml) + Test & Validate.
# `cooldown` delays new versions by 7 days so a poisoned release is usually
# pulled from the registry before we ever open a PR for it.

version: 2
updates:
  # NPM dependencies (main package)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"  # Monday mornings (not too noisy)
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5  # Max concurrent PRs
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "automated"

    # Ignore major version bumps — they break CI and need manual migration.
    # Security updates bypass ignore rules, so critical fixes still come through.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/uuid"
        # uuid v9+ includes its own TypeScript types
      - dependency-name: "@types/glob"
        # glob v9+ includes its own TypeScript types

    # Group related packages to avoid peer dependency issues
    groups:
      # CRITICAL: Group vitest packages together (strict peer dependencies)
      vitest-ecosystem:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - "minor"
          - "patch"

      # Group TypeScript tooling
      typescript-tooling:
        patterns:
          - "typescript"
          - "@types/node"
        update-types:
          - "minor"
          - "patch"

      # Group Playwright (test framework)
      playwright:
        patterns:
          - "@playwright/*"
          - "playwright"
        update-types:
          - "minor"
          - "patch"

      # Production dependencies (non-grouped)
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
        # Exclude packages in other groups
        exclude-patterns:
          - "vitest*"
          - "@vitest/*"
          - "typescript"
          - "@playwright/*"

      # Development dependencies (non-grouped)
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
        # Exclude packages in other groups
        exclude-patterns:
          - "vitest*"
          - "@vitest/*"
          - "typescript"
          - "@types/node"
          - "@playwright/*"

    # Keep security updates separate (high priority)
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # GitHub Actions (workflow dependencies)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"  # Less frequent (actions change slowly)
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "ci/cd"
      - "automated"
    commit-message:
      prefix: "chore(ci)"
