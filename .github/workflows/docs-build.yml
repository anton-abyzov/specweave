name: Documentation Build

# This workflow validates documentation builds on pull requests only.
# For pushes to develop, use deploy-docs.yml which builds AND deploys.
# This eliminates redundant builds while maintaining PR validation.

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'docs-site/**'
      - '.specweave/docs/public/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.github/workflows/docs-build.yml'

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'docs-site/package-lock.json'

      - name: Install dependencies
        run: |
          cd docs-site
          npm ci

      - name: Sync root README to docs-site
        run: |
          # Copy README.md to docs-site as an overview page
          cp README.md docs-site/docs/overview/readme.md
          # Add frontmatter for Docusaurus
          sed -i '1i---\nsidebar_position: 0\ntitle: README\ndescription: SpecWeave project overview from GitHub README\n---\n' docs-site/docs/overview/readme.md
          echo "✅ Synced README.md to docs-site"

      - name: Build documentation
        run: |
          cd docs-site
          npm run build

      - name: Check build output
        run: |
          if [ ! -d "docs-site/build" ]; then
            echo "Build directory not found!"
            exit 1
          fi
          echo "Build directory size:"
          du -sh docs-site/build
          echo "Build contents:"
          ls -la docs-site/build

      - name: Upload build artifacts (for debugging)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs
          path: |
            docs-site/.docusaurus
            docs-site/build

  # Broken link checker for documentation PRs
  link-check:
    name: Check for Broken Links
    runs-on: ubuntu-latest
    needs: build
    if: success()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'docs-site/package-lock.json'

      - name: Install dependencies
        run: |
          cd docs-site
          npm ci

      - name: Build and serve
        run: |
          cd docs-site
          npm run build
          npx serve build -l 3000 &
          sleep 5

      - name: Check for broken links
        run: |
          npx linkinator http://localhost:3000 --recurse --verbosity error --skip "github.com/anton-abyzov/specweave/edit"
