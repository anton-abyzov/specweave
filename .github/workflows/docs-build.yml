name: Documentation Build

# This workflow validates documentation builds on pull requests only.
# For pushes to develop, use deploy-docs.yml which builds AND deploys.
# This eliminates redundant builds while maintaining PR validation.

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'docs-site/**'
      - 'src/styles/brand-tokens.css'
      - '.specweave/docs/public/**'
      - 'README.md'
      - '.github/workflows/docs-build.yml'

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'docs-site/package-lock.json'

      - name: Install dependencies (no install scripts)
        run: |
          cd docs-site
          npm ci --ignore-scripts
          npm run setup

      - name: Sync root README to docs-site
        run: |
          # Copy README.md to docs-site as an overview page
          cp README.md docs-site/docs/overview/readme.md
          # Add frontmatter for Docusaurus
          sed -i '1i---\nsidebar_position: 0\ntitle: README\ndescription: SpecWeave project overview from GitHub README\n---\n' docs-site/docs/overview/readme.md
          echo "Synced README.md to docs-site"

      - name: Build documentation
        env:
          DOCS_SOURCE_REF: ${{ github.event.pull_request.head.sha }}
        run: |
          cd docs-site
          npm run build

      - name: Check build output
        run: |
          if [ ! -d "docs-site/build" ]; then
            echo "Build directory not found!"
            exit 1
          fi
          echo "Build directory size:"
          du -sh docs-site/build

      # The link check runs on this runner against the build it just made:
      # no second checkout, no artifact round trip.
      - name: Verify candidate link checking
        run: node docs-site/tests/candidate-links.mjs

      - name: Serve and check links
        run: |
          npx --yes serve@14.2.6 docs-site/build -l tcp://127.0.0.1:3000 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "Documentation server did not become ready within 60 seconds"
            exit 1
          fi
          node docs-site/scripts/check-candidate-links.mjs http://127.0.0.1:3000

      - name: Upload docs build artifact (for debugging)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docs-build
          path: docs-site/build
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload build logs (for debugging)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: docs-site/.docusaurus
