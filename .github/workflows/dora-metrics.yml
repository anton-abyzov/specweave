name: DORA Metrics

on:
  # Run twice daily at 06:00 and 18:00 UTC (single cron more reliable than multiple)
  schedule:
    - cron: '0 6,18 * * *'

  # Allow manual triggers
  workflow_dispatch:

jobs:
  calculate-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push metrics JSON or create branch
      pull-requests: write  # Required to create PR if branch protection blocks push
      issues: write  # Required to create error issue on failure

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup and build
        uses: ./.github/actions/setup-and-build

      - name: Calculate DORA metrics
        id: calculate
        continue-on-error: true
        run: npm run metrics:dora
        env:
          # Safe: Using GitHub-provided secrets and metadata (not user input)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Check metrics calculation result
        if: steps.calculate.outcome == 'failure'
        run: |
          echo "⚠️ DORA metrics calculation failed - this may be due to API rate limits or permission issues"
          echo "The workflow will continue but metrics will not be updated"

      - name: Commit and push metrics (or create PR)
        if: steps.calculate.outcome == 'success'
        id: commit-metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .specweave/metrics/dora-latest.json .specweave/metrics/dora-report.md

          if git diff --staged --quiet; then
            echo "ℹ️ No changes to commit"
            echo "result=no-changes" >> $GITHUB_OUTPUT
            exit 0
          fi

          COMMIT_MSG="chore: update DORA metrics - $(date '+%b %d, %Y') [skip ci]"
          git commit -m "$COMMIT_MSG"

          # Try direct push first (works if bot has bypass or no protection)
          if git push origin HEAD:develop 2>&1; then
            echo "✅ Successfully pushed metrics update directly"
            echo "result=pushed" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "⚠️ Direct push failed (branch protection). Creating PR..."

          # Create unique branch for this update
          BRANCH_NAME="automated/dora-metrics-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"

          if ! git push -u origin "$BRANCH_NAME" 2>&1; then
            echo "❌ Failed to push branch. Check permissions."
            echo "result=branch-push-failed" >> $GITHUB_OUTPUT
            exit 0  # Don't fail - metrics were calculated successfully
          fi

          # Create PR with simple body
          if gh pr create --title "$COMMIT_MSG" --body "Automated DORA metrics update. Merge to update the report on GitHub." 2>&1; then
            echo "✅ Created PR for metrics update"
            echo "result=pr-created" >> $GITHUB_OUTPUT
            # Try to enable auto-merge
            gh pr merge --auto --squash 2>/dev/null || echo "💡 Auto-merge not enabled - PR requires manual merge"
          else
            echo "⚠️ Could not create PR. This is expected if GitHub Actions is not permitted to create PRs."
            echo "💡 To fix: Go to repo Settings > Actions > General > Workflow permissions"
            echo "   Enable 'Allow GitHub Actions to create and approve pull requests'"
            echo "📊 Metrics were calculated successfully but could not be committed."
            echo "result=pr-creation-blocked" >> $GITHUB_OUTPUT
            # Delete the orphan branch
            git push origin --delete "$BRANCH_NAME" 2>/dev/null || true
          fi

      - name: Report workflow status
        if: always()
        run: |
          if [ "${{ steps.calculate.outcome }}" = "success" ]; then
            echo "✅ DORA metrics calculation succeeded"
          else
            echo "⚠️ DORA metrics calculation skipped or failed"
            echo "This is not critical - metrics are optional"
          fi
