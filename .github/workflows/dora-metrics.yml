name: DORA Metrics

on:
  # Run twice daily at 06:00 and 18:00 UTC (single cron more reliable than multiple)
  schedule:
    - cron: '0 6,18 * * *'

  # Allow manual triggers
  workflow_dispatch:

jobs:
  calculate-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push metrics JSON or create branch
      pull-requests: write  # Required to create PR if branch protection blocks push
      issues: write  # Required to create error issue on failure

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Calculate DORA metrics
        run: npm run metrics:dora
        env:
          # Safe: Using GitHub-provided secrets and metadata (not user input)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Commit and push metrics (or create PR)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .specweave/metrics/dora-latest.json .specweave/metrics/dora-report.md

          if git diff --staged --quiet; then
            echo "ℹ️ No changes to commit"
            exit 0
          fi

          COMMIT_MSG="chore: update DORA metrics - $(date '+%b %d, %Y') [skip ci]"
          git commit -m "$COMMIT_MSG"

          # Try direct push first (works if bot has bypass or no protection)
          if git push origin HEAD:develop 2>&1; then
            echo "✅ Successfully pushed metrics update directly"
            exit 0
          fi

          echo "⚠️ Direct push failed (branch protection). Creating PR..."

          # Create unique branch for this update
          BRANCH_NAME="automated/dora-metrics-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"
          git push -u origin "$BRANCH_NAME"

          # Create PR with simple body
          gh pr create --title "$COMMIT_MSG" --body "Automated DORA metrics update. Merge to update the report on GitHub."

          echo "✅ Created PR for metrics update"

          # Try to enable auto-merge
          gh pr merge --auto --squash 2>/dev/null || echo "💡 Auto-merge not enabled - PR requires manual merge"

      - name: Create error issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          # Safe: actions/github-script handles escaping automatically
          # No user input used - only GitHub metadata
          script: |
            const title = 'DORA Metrics Workflow Failed';
            const body = `
              ## DORA Metrics Calculation Error

              **Workflow Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              **Timestamp**: ${new Date().toISOString()}
              **Branch**: ${{ github.ref }}

              ### Error Details

              The DORA metrics calculation workflow failed. Please check the workflow logs for details.

              ### Possible Causes

              - GitHub API rate limit exceeded
              - Invalid GITHUB_TOKEN
              - Missing dependencies
              - Calculation error in metrics code

              ### Next Steps

              1. Review workflow logs
              2. Check GitHub API rate limits
              3. Re-run workflow manually if transient error
              4. Fix calculation code if persistent error
            `;

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body
            });
