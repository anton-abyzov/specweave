name: Init cross-platform

on:
  pull_request:
    paths:
      - 'src/cli/commands/init.ts'
      - 'src/cli/helpers/init/**'
      - 'src/adapters/**'
      - 'src/templates/**'
      - 'tests/unit/cli/commands/init-*.test.ts'
      - '.github/workflows/init-crossplatform.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  init:
    name: init CLI tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs-site/static/
            !/video/
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild
      - run: npm run build
      - name: Init CLI tests (a second run changes no file, refusals, app contract)
        run: npx vitest run tests/unit/cli/commands/init-simple.test.ts tests/unit/cli/commands/init-app-contract.test.ts tests/unit/cli/commands/init-rerun-safety.test.ts
