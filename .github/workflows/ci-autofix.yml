name: CI Auto-Fix

on:
  workflow_run:
    workflows: ["Test & Validate"]
    types: [completed]
    branches: [develop, main]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: ci-autofix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  autofix:
    # Only run on real failures; skip bot-created branches to prevent cascade loops
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      !startsWith(github.event.workflow_run.head_branch, 'ci-autofix/') &&
      !startsWith(github.event.workflow_run.head_branch, 'fix/ci-')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check for existing bot fix PRs
        id: dedup-check
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.payload.workflow_run.head_branch;

            // Check for open bot PRs targeting this branch
            const { data: prs } = await github.rest.pulls.list({
              owner, repo, state: 'open', base: branch, per_page: 100
            });

            const botPRs = prs.filter(pr =>
              pr.user.login === 'claude[bot]' ||
              pr.head.ref.startsWith('ci-autofix/') ||
              pr.head.ref.startsWith('fix/ci-')
            );

            if (botPRs.length > 0) {
              core.setOutput('skip', 'true');
              core.setOutput('reason', `existing-pr-${botPRs[0].number}`);
              console.log(`Open bot PR #${botPRs[0].number} exists -- skipping to prevent duplicates`);
              return;
            }

            // Check retry count: how many bot PRs were closed in last 24h
            const { data: closedPRs } = await github.rest.pulls.list({
              owner, repo, state: 'closed', base: branch, per_page: 50
            });

            const oneDayAgo = new Date(Date.now() - 24 * 60 * 60 * 1000);
            const recentClosedBot = closedPRs.filter(pr => {
              const isBot = pr.user.login === 'claude[bot]' ||
                pr.head.ref.startsWith('ci-autofix/') ||
                pr.head.ref.startsWith('fix/ci-');
              return isBot && new Date(pr.closed_at) > oneDayAgo;
            });

            if (recentClosedBot.length >= 2) {
              core.setOutput('skip', 'true');
              core.setOutput('escalate', 'true');
              core.setOutput('reason', `${recentClosedBot.length}-bot-prs-closed-in-24h`);
              console.log(`${recentClosedBot.length} bot PRs closed in 24h -- escalating`);
              return;
            }

            core.setOutput('skip', 'false');

      - name: Checkout failing branch
        if: steps.dedup-check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 5
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for auto-fix loop
        if: steps.dedup-check.outputs.skip != 'true'
        id: loop-check
        run: |
          LAST_MSG=$(git log -1 --pretty=%s)
          if echo "$LAST_MSG" | grep -qE "^fix\(ci\):"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Last commit was already an auto-fix. Stopping to prevent loop."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get failure logs
        if: steps.dedup-check.outputs.skip != 'true' && steps.loop-check.outputs.skip != 'true'
        id: failure-logs
        uses: actions/github-script@v8
        with:
          script: |
            const runId = context.payload.workflow_run.id;
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId
            });
            let failedLogs = '';
            for (const job of jobs.data.jobs) {
              if (job.conclusion === 'failure') {
                try {
                  const logs = await github.rest.actions.downloadJobLogsForWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    job_id: job.id
                  });
                  const logLines = logs.data.split('\n');
                  failedLogs += `\n=== Job: ${job.name} ===\n${logLines.slice(-200).join('\n')}\n`;
                } catch (e) {
                  console.log(`Could not get logs for job ${job.id}: ${e.message}`);
                }
              }
            }
            const fs = require('fs');
            fs.writeFileSync('failure-logs.txt', failedLogs || 'No detailed logs available');

      - name: Classify failure
        if: steps.dedup-check.outputs.skip != 'true' && steps.loop-check.outputs.skip != 'true'
        id: classify
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const logs = fs.readFileSync('failure-logs.txt', 'utf-8');

            // Known pre-existing failures that the bot should NOT attempt to fix
            const KNOWN_UNFIXABLE = [
              "Cannot find module '../../src/cli/commands/project.js'",
              "Cannot find module './project.js'",
            ];

            const matchedPatterns = KNOWN_UNFIXABLE.filter(p => logs.includes(p));
            const hasFixableFailures = logs.includes('FAIL') || logs.includes('npm ERR!') ||
              logs.includes('Error:') || logs.includes('TypeScript');

            if (matchedPatterns.length > 0 && !hasFixableFailures) {
              core.setOutput('skip', 'true');
              core.setOutput('reason', 'only-known-unfixable-failures');
              console.log(`Only known unfixable failures detected: ${matchedPatterns.join(', ')}`);
            } else {
              core.setOutput('skip', 'false');
              const isBuild = logs.includes('tsc') || logs.includes('npm ERR!');
              core.setOutput('failure_type', isBuild ? 'build' : 'test');
            }

      - name: Setup and build
        if: |
          steps.dedup-check.outputs.skip != 'true' &&
          steps.loop-check.outputs.skip != 'true' &&
          steps.classify.outputs.skip != 'true'
        uses: ./.github/actions/setup-and-build

      - name: Create fix branch
        if: |
          steps.dedup-check.outputs.skip != 'true' &&
          steps.loop-check.outputs.skip != 'true' &&
          steps.classify.outputs.skip != 'true'
        id: fix-branch
        run: |
          BRANCH="ci-autofix/fix-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "base=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"

      - name: Auto-fix with Claude
        if: |
          steps.dedup-check.outputs.skip != 'true' &&
          steps.loop-check.outputs.skip != 'true' &&
          steps.classify.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            CI tests failed on the ${{ github.event.workflow_run.head_branch }} branch.
            Failure type: ${{ steps.classify.outputs.failure_type }}

            ## Instructions

            1. Read failure-logs.txt for error details
            2. Run `npm run test:unit` to reproduce locally
            3. Fix the root cause with minimal changes
            4. Verify the fix passes: `npm run test:unit`
            5. Commit and push to THIS branch (you are on ${{ steps.fix-branch.outputs.branch }})

            ## CRITICAL RULES

            - Push to the CURRENT branch only (${{ steps.fix-branch.outputs.branch }})
            - Do NOT create additional branches or PRs
            - ONLY fix test/build failures, do not refactor or improve unrelated code
            - Keep changes minimal - just enough to make CI pass
            - If E2E tests seem environment-specific or flaky, skip them and focus on unit/smoke
            - If unfixable, create a GitHub issue with label "ci-failure" explaining the problem
            - Commit message MUST start with "fix(ci): " followed by short description
            - No emoji, no AI references, no Co-Authored-By in commit messages
            - Do NOT commit failure-logs.txt or any other non-source files

            ## Commit and Push

            ```bash
            git add -u  # only tracked files
            git commit -m "fix(ci): <describe what was fixed>"
            git push -u origin ${{ steps.fix-branch.outputs.branch }}
            ```
          claude_args: '--allowed-tools "Bash(git*),Bash(npm*),Bash(npx*),Read,Write,Edit,Glob,Grep"'

      - name: Create PR with auto-merge
        if: |
          steps.dedup-check.outputs.skip != 'true' &&
          steps.loop-check.outputs.skip != 'true' &&
          steps.classify.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if Claude actually pushed commits
          if ! git log --oneline origin/${{ steps.fix-branch.outputs.branch }}..HEAD 2>/dev/null | grep -q .; then
            # Check remote branch exists and has commits ahead of base
            AHEAD=$(gh api repos/${{ github.repository }}/compare/${{ steps.fix-branch.outputs.base }}...${{ steps.fix-branch.outputs.branch }} --jq '.ahead_by' 2>/dev/null || echo "0")
            if [ "$AHEAD" = "0" ]; then
              echo "No fix commits were pushed. Skipping PR creation."
              exit 0
            fi
          fi

          PR_URL=$(gh pr create \
            --base "${{ steps.fix-branch.outputs.base }}" \
            --head "${{ steps.fix-branch.outputs.branch }}" \
            --title "fix(ci): auto-fix test failures on ${{ steps.fix-branch.outputs.base }}" \
            --body "Automated fix for CI test failures on \`${{ steps.fix-branch.outputs.base }}\`.

          Triggered by failed run: ${{ github.event.workflow_run.html_url }}

          This PR will auto-merge after CI passes." \
            2>&1) || true

          if echo "$PR_URL" | grep -q "https://"; then
            echo "Created PR: $PR_URL"
            # Auto-approve and enable auto-merge
            gh pr review --approve "$PR_URL"
            gh pr merge --auto --squash "$PR_URL"
          else
            echo "PR creation output: $PR_URL"
          fi

      - name: Escalate to human
        if: |
          always() &&
          (steps.dedup-check.outputs.escalate == 'true' || steps.loop-check.outputs.skip == 'true')
        uses: actions/github-script@v8
        with:
          script: |
            const branch = context.payload.workflow_run.head_branch;
            const reason = '${{ steps.dedup-check.outputs.reason }}' || 'loop-detected';
            const title = `CI auto-fix needs human intervention: ${branch}`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure'
            });

            if (!existing.data.some(i => i.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: [
                  `The CI auto-fix bot has been unable to resolve failures on \`${branch}\`.`,
                  '',
                  `**Reason**: ${reason}`,
                  `**Failed run**: ${context.payload.workflow_run.html_url}`,
                  '',
                  'This requires manual investigation. The bot will not attempt further fixes',
                  'until this issue is closed or the existing bot PRs are resolved.',
                ].join('\n'),
                labels: ['ci-failure']
              });
            }
