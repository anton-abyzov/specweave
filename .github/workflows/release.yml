name: Release & Publish

on:
  # REMOVED: push on tags - causes infinite loop when workflow creates tags
  # Tags are created by workflow_dispatch, then npm publish happens automatically
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.7.1, 0.8.0)'
        required: true
        type: string
      version_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

# Prevent duplicate runs
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Only run on manual workflow_dispatch, not on push events
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Required for npm provenance

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for changelog
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build project
        run: npm run build

      # Tests removed - they run separately in test.yml workflow
      # Release only needs build to succeed

      - name: Bump version (manual workflow only)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION_TYPE: ${{ github.event.inputs.version_type }}
        run: npm version "$VERSION_TYPE" --no-git-tag-version

      - name: Extract version from package.json
        id: package_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Version: $VERSION"

      - name: Verify version matches input (manual workflow only)
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_VERSION: ${{ github.event.inputs.version }}
          ACTUAL_VERSION: ${{ steps.package_version.outputs.version }}
        run: |
          echo "Expected version: $EXPECTED_VERSION"
          echo "Actual version after bump: $ACTUAL_VERSION"

          # If versions match, great!
          if [ "$EXPECTED_VERSION" = "$ACTUAL_VERSION" ]; then
            echo "✅ Version matches: $ACTUAL_VERSION"
            exit 0
          fi

          # If they don't match, show warning but continue
          # (User might have specified the PRE-bump version by mistake)
          echo "⚠️  Version mismatch - Expected: $EXPECTED_VERSION, Got: $ACTUAL_VERSION"
          echo "ℹ️  Continuing with bumped version: $ACTUAL_VERSION"
          echo "💡 Next time, specify the FINAL version (after bump), not the current one"

      - name: Ensure CHANGELOG entry exists
        env:
          VERSION: ${{ steps.package_version.outputs.version }}
        run: |
          echo "🔍 Checking CHANGELOG entry for version $VERSION..."

          # Check if version exists in CHANGELOG
          if grep -q "## \[$VERSION\]" CHANGELOG.md; then
            echo "✅ CHANGELOG entry found for $VERSION"

            # Verify release notes are not empty
            NOTES=$(awk "/## \[$VERSION\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
            NOTES_LINES=$(echo "$NOTES" | wc -l | tr -d ' ')

            if [ -z "$NOTES" ] || [ "$NOTES_LINES" -lt 3 ]; then
              echo "⚠️  WARNING: CHANGELOG entry is short, but continuing..."
            else
              echo "✅ CHANGELOG entry has content ($NOTES_LINES lines)"
            fi
          else
            echo "⚠️  No CHANGELOG entry found for $VERSION - auto-generating..."

            # Get commits since last tag
            LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$LAST_TAG" ]; then
              COMMITS=$(git log --oneline "$LAST_TAG"..HEAD --no-merges | head -10)
            else
              COMMITS=$(git log --oneline -10 --no-merges)
            fi

            # Create auto-generated entry
            TEMP_FILE=$(mktemp)
            cat > "$TEMP_FILE" << ENTRY
# Changelog

All notable changes to SpecWeave will be documented in this file.

---

## [$VERSION] - $(date +%Y-%m-%d)

### Changes
$(echo "$COMMITS" | sed 's/^[a-f0-9]* /- /')

---

ENTRY

            # Append rest of changelog (skip header)
            tail -n +7 CHANGELOG.md >> "$TEMP_FILE"
            mv "$TEMP_FILE" CHANGELOG.md

            echo "✅ Auto-generated CHANGELOG entry for $VERSION"

            # Commit the auto-generated changelog
            git add CHANGELOG.md
            git commit -m "docs: auto-generate CHANGELOG entry for $VERSION" || true
          fi

      - name: Extract release notes from CHANGELOG
        id: changelog
        env:
          VERSION: ${{ steps.package_version.outputs.version }}
        run: |
          # Extract release notes for this version from CHANGELOG.md
          # Use flag-based extraction to avoid matching the same header twice
          NOTES=$(awk "/## \[$VERSION\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)

          # Write to file for GitHub release
          echo "$NOTES" > /tmp/release-notes.md

          # Also output for debugging
          echo "Release notes extracted for v$VERSION"
          cat /tmp/release-notes.md

      - name: Commit version bump (manual workflow only)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.package_version.outputs.version }}
        run: |
          git add package.json package-lock.json
          git commit -m "chore: bump version to $VERSION"

      - name: Create and push git tag (manual workflow only)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.package_version.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Publish to npm
        run: npm publish --provenance --access public || npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.package_version.outputs.version }}
        run: |
          # Use gh CLI instead of deprecated actions/create-release
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file /tmp/release-notes.md \
            --latest

      - name: Notify release success
        if: success()
        env:
          VERSION: ${{ steps.package_version.outputs.version }}
        run: |
          echo "✅ Successfully released v$VERSION"
          echo "📦 NPM: https://www.npmjs.com/package/specweave/v/$VERSION"
          echo "🐙 GitHub: https://github.com/anton-abyzov/specweave/releases/tag/v$VERSION"

      - name: Notify release failure
        if: failure()
        env:
          VERSION: ${{ steps.package_version.outputs.version }}
        run: |
          echo "❌ Release failed for v$VERSION"
          echo "Check logs above for details"

  # ============================================================
  # Auto-Fix: Create issue for @claude when release fails
  # ============================================================
  notify-failure:
    name: Create Auto-Fix Issue
    runs-on: ubuntu-latest
    needs: [release]
    # Only run if release job actually failed (not skipped due to wrong event type)
    if: failure() && github.event_name == 'workflow_dispatch'

    permissions:
      issues: write

    steps:
      - name: Create release failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ github.ref_name }}';
            const sha = '${{ github.sha }}';
            const runId = '${{ github.run_id }}';
            const runUrl = `https://github.com/${{ github.repository }}/actions/runs/${runId}`;

            // Check if an issue already exists for this release
            const { data: existingIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 50
            });

            const existingIssue = existingIssues.find(issue =>
              issue.title.includes('[Release-Fix]') &&
              issue.title.includes(tag)
            );

            if (existingIssue) {
              console.log(`Issue already exists: #${existingIssue.number}`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `🔄 Release still failing: [Run #${runId}](${runUrl})`
              });
              return;
            }

            // Get existing labels
            const labels = [];
            for (const name of ['bug', 'release']) {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name });
                labels.push(name);
              } catch (e) { /* label doesn't exist */ }
            }

            // Create new issue
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Release-Fix] Release ${tag} failed`,
              body: `## Release Failure Detected

@claude Please analyze this release failure and suggest a fix.

### Details
| Field | Value |
|-------|-------|
| **Tag** | \`${tag}\` |
| **Commit** | [\`${sha.slice(0,7)}\`](https://github.com/${{ github.repository }}/commit/${sha}) |
| **Run** | [#${runId}](${runUrl}) |

### Common Release Failure Causes
1. Missing CHANGELOG entry for the version
2. npm publish failure (token, version conflict)
3. GitHub release already exists

### Instructions
1. Click the **Run** link to view failure logs
2. Identify the root cause
3. Fix and re-run or create a PR

---
*Auto-generated by Release & Publish workflow*`,
              labels: labels.length > 0 ? labels : undefined
            });

            console.log(`Created issue #${issue.number}`);
