name: Release & Publish

# Three ways in, one publish path:
#   1. Run this workflow on develop (Actions tab, or
#      `gh workflow run release.yml --ref develop -f version_type=patch`).
#      It bumps the version on a `release/vX.Y.Z` branch and opens a PR.
#      develop only accepts pull requests, so nothing is published yet.
#   2. Merging a PR that changes package.json's version into develop publishes
#      it: the commit is tagged vX.Y.Z here and released to npm.
#   3. Pushing a vX.Y.Z tag yourself still publishes that tag.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'  # Matches v1.0.0, v1.0.0-rc.1, etc.
    branches:
      - develop
    paths:
      - 'package.json'
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version (e.g. 3.1.0, 3.1.0-rc.1). Empty bumps by version_type.'
        required: false
        type: string
      version_type:
        description: 'Bump used when version is empty'
        required: false
        type: choice
        default: 'patch'
        options:
          - patch
          - minor
          - major
          - prerelease
      dry_run:
        description: 'Bump, build and pack only: push no branch, open no PR'
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Open the release PR
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Only develop can open a release PR
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/develop' }}
        run: |
          echo "::error::Run the release from develop (got $GITHUB_REF), or tick dry_run."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies (no install scripts)
        run: |
          npm install --ignore-scripts
          npm run setup

      # The `version` npm script writes the CHANGELOG heading and stamps the
      # plugin and marketplace manifests.
      - name: Bump version and commit
        id: bump
        env:
          REQUESTED: ${{ inputs.version }}
          VERSION_TYPE: ${{ inputs.version_type }}
        run: |
          REQUESTED="${REQUESTED#v}"
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || echo "")
          HAD_UNRELEASED=false
          head -1 CHANGELOG.md | grep -q '^## \[Unreleased\]' && HAD_UNRELEASED=true
          npm version "${REQUESTED:-$VERSION_TYPE}" --no-git-tag-version --ignore-scripts=false
          VERSION=$(node -p "require('./package.json').version")
          # No [Unreleased] notes: list the commits since the last tag in
          # place of the "- Patch release" placeholder.
          if [ "$HAD_UNRELEASED" = false ]; then
            git log --no-merges --format='- %s' ${LAST_TAG:+"$LAST_TAG"..HEAD} | head -30 > /tmp/commits.md
            if [ -s /tmp/commits.md ]; then
              node -e "
                const fs = require('fs');
                const notes = fs.readFileSync('/tmp/commits.md', 'utf8').trimEnd();
                const log = fs.readFileSync('CHANGELOG.md', 'utf8');
                fs.writeFileSync('CHANGELOG.md', log.replace('\n\n- Patch release\n', '\n\n' + notes + '\n'));
              "
            fi
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION is already tagged"
            exit 1
          fi
          git checkout -b "release/v$VERSION"
          git add package.json package-lock.json CHANGELOG.md plugins/specweave/.claude-plugin/plugin.json .claude-plugin/marketplace.json
          git commit -m "Release $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          awk "/^## \[$VERSION\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: Build project
        run: npm run build

      - name: Validate version alignment
        run: npm run validate:versions

      - name: Preflight the publish tarball
        run: npm run release:preflight

      - name: Verify the packed CLI installs cleanly
        run: node scripts/release/verify-package-install.mjs

      - name: Push the release branch and open the PR
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git push origin "release/v$VERSION"
          {
            echo "Merging this publishes \`specweave@$VERSION\` to npm: the merge commit is tagged \`v$VERSION\` and released by this workflow."
            echo ""
            cat /tmp/release-notes.md
          } > /tmp/pr-body.md
          if ! gh pr create --base develop --head "release/v$VERSION" --title "Release $VERSION" --body-file /tmp/pr-body.md; then
            echo "::warning::Could not open the PR with the Actions token. Open it here: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/develop...release/v$VERSION?expand=1"
          fi

  detect:
    name: Decide whether to publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Decide
        id: decide
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            RELEASE=true
          else
            VERSION=$(node -p "require('./package.json').version")
            RELEASE=true
            if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
              echo "v$VERSION is already tagged; package.json changed for another reason"
              RELEASE=false
            elif npm view "specweave@$VERSION" version >/dev/null 2>&1; then
              echo "::warning::specweave@$VERSION is on npm but has no tag; not releasing it again"
              RELEASE=false
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION release=$RELEASE"

  release:
    name: Release
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.detect.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing (OIDC) needs npm >= 11.5.1; Node 22 ships an older
      # npm. Without this the publish silently falls back to token auth.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm i -g npm@12.0.2

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies (no install scripts)
        run: |
          npm install --ignore-scripts
          npm run setup

      - name: Build project
        run: npm run build

      # prepublishOnly is skipped under the committed .npmrc (ignore-scripts),
      # so run the version-alignment gate explicitly.
      - name: Validate version alignment
        run: npm run validate:versions

      # ...and the tarball gate, for the same reason: this inspects what
      # `npm pack` would actually upload, so a build that silently produced
      # nothing cannot reach `npm publish` below.
      - name: Preflight the publish tarball
        run: npm run release:preflight

      - name: Verify package.json version matches the release
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::Release version ($VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "✅ Version verified: $PKG_VERSION"

      - name: Auto-generate CHANGELOG if needed
        run: |
          if grep -q "## \[$VERSION\]" CHANGELOG.md && ! grep -A5 "## \[$VERSION\]" CHANGELOG.md | grep -q "TODO: Describe your changes here"; then
            echo "CHANGELOG entry found for $VERSION"
          else
            echo "Auto-generating CHANGELOG entry for $VERSION..."
            LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$LAST_TAG" ]; then
              COMMITS=$(git log --oneline "$LAST_TAG"..HEAD --no-merges | head -10)
            else
              COMMITS=$(git log --oneline -10 --no-merges)
            fi
            TEMP_FILE=$(mktemp)
            {
              echo "## [$VERSION] - $(date +%Y-%m-%d)"
              echo ""
              echo "$COMMITS" | sed 's/^[a-f0-9]* /- /'
              echo ""
              cat CHANGELOG.md
            } > "$TEMP_FILE"
            mv "$TEMP_FILE" CHANGELOG.md
          fi

      - name: Extract release notes
        run: |
          awk "/^## \[$VERSION\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > /tmp/release-notes.md
          cat /tmp/release-notes.md

      # A version bump merged into develop has no tag yet: tag that commit.
      # Tags pushed with the Actions token start no other workflow run.
      - name: Tag the release commit
        if: github.ref_type == 'branch'
        run: |
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"

      - name: Check if version already published
        id: check-published
        run: |
          if npm view "specweave@$VERSION" version 2>/dev/null; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Version $VERSION is already published on npm, skipping publish"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      # Publishes via npm Trusted Publishing (OIDC) — no token, no OTP.
      # Configured at npmjs.com/package/specweave/access → Trusted Publisher:
      #   org anton-abyzov · repo specweave · workflow release.yml.
      # Requires `permissions: id-token: write` (set on the job above).
      #
      # Deliberately NO `NODE_AUTH_TOKEN` here: a stale/revoked token in the
      # env makes npm prefer token auth and fail 401 instead of using OIDC.
      # Deliberately NO `--provenance`: trusted publishing attaches provenance
      # automatically, and passing it alongside OIDC is redundant.
      - name: Publish to npm (OIDC trusted publishing)
        if: steps.check-published.outputs.already_published != 'true'
        run: |
          npm --version
          # Check if it's a prerelease version
          if [[ "$VERSION" == *-* ]]; then
            echo "Publishing prerelease version with 'next' tag..."
            npm publish --access public --tag next
          else
            echo "Publishing stable version..."
            npm publish --access public
          fi

      # npm can accept an upload while registry processing still returns 404.
      # A successful publish command is not yet a publicly installable release.
      - name: Verify public package and clean CLI installation
        run: node scripts/release/verify-package-install.mjs --published "$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if release already exists
          if gh release view "v$VERSION" &>/dev/null; then
            echo "Release v$VERSION already exists, skipping creation"
            exit 0
          fi
          if [[ "$VERSION" == *-* ]]; then
            gh release create "v$VERSION" \
              --title "v$VERSION" \
              --notes-file /tmp/release-notes.md \
              --prerelease
          else
            gh release create "v$VERSION" \
              --title "v$VERSION" \
              --notes-file /tmp/release-notes.md \
              --latest
          fi

      - name: Success notification
        run: |
          echo "Successfully released v$VERSION"
          echo "NPM: https://www.npmjs.com/package/specweave/v/$VERSION"
          echo "GitHub: https://github.com/anton-abyzov/specweave/releases/tag/v$VERSION"
