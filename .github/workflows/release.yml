name: Release & Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'  # Matches v1.0.0, v1.0.0-rc.1, etc.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.7.1, 0.8.0, 1.0.0-rc.1)'
        required: true
        type: string
      version_type:
        description: 'Version bump type (ignored if version contains -rc or -beta)'
        required: false
        type: choice
        default: 'patch'
        options:
          - patch
          - minor
          - major
          - prerelease

jobs:
  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build project
        run: npm run build

      - name: Extract version
        id: package_version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Extract version from tag (remove 'v' prefix)
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "Version from tag: $VERSION"
          else
            # Use version from package.json for workflow_dispatch
            VERSION=$(node -p "require('./package.json').version")
            echo "Version from package.json: $VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Final version: $VERSION"

      - name: Verify package.json version matches tag
        if: github.event_name == 'push'
        env:
          TAG_VERSION: ${{ steps.package_version.outputs.version }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            echo "Please ensure package.json version matches the tag before creating a release."
            exit 1
          fi
          echo "✅ Version verified: $PKG_VERSION"

      - name: Auto-generate CHANGELOG if needed
        env:
          VERSION: ${{ steps.package_version.outputs.version }}
        run: |
          if grep -q "## \[$VERSION\]" CHANGELOG.md; then
            echo "CHANGELOG entry found for $VERSION"
          else
            echo "Auto-generating CHANGELOG entry for $VERSION..."
            LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$LAST_TAG" ]; then
              COMMITS=$(git log --oneline "$LAST_TAG"..HEAD --no-merges | head -10)
            else
              COMMITS=$(git log --oneline -10 --no-merges)
            fi
            TEMP_FILE=$(mktemp)
            {
              echo "# Changelog"
              echo ""
              echo "All notable changes to SpecWeave will be documented in this file."
              echo ""
              echo "---"
              echo ""
              echo "## [$VERSION] - $(date +%Y-%m-%d)"
              echo ""
              echo "### Changes"
              echo "$COMMITS" | sed 's/^[a-f0-9]* /- /'
              echo ""
              echo "---"
              echo ""
              tail -n +7 CHANGELOG.md
            } > "$TEMP_FILE"
            mv "$TEMP_FILE" CHANGELOG.md
            git add CHANGELOG.md
            git commit -m "docs: auto-generate CHANGELOG entry for $VERSION" || true
          fi

      - name: Extract release notes
        id: changelog
        env:
          VERSION: ${{ steps.package_version.outputs.version }}
        run: |
          awk "/## \[$VERSION\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: Bump version and commit (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ github.event.inputs.version }}
          VERSION_TYPE: ${{ github.event.inputs.version_type }}
        run: |
          # If specific version provided, use it; otherwise bump
          if [ -n "$VERSION" ] && [ "$VERSION" != "" ]; then
            npm version "$VERSION" --no-git-tag-version
          else
            npm version "$VERSION_TYPE" --no-git-tag-version
          fi
          NEW_VERSION=$(node -p "require('./package.json').version")
          git add package.json package-lock.json
          git commit -m "chore: bump version to $NEW_VERSION"
          git tag "v$NEW_VERSION"
          git push origin develop
          git push origin "v$NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.package_version.outputs.version }}
        run: |
          # Check if it's a prerelease version
          if [[ "$VERSION" == *"-rc"* ]] || [[ "$VERSION" == *"-beta"* ]] || [[ "$VERSION" == *"-alpha"* ]]; then
            echo "Publishing prerelease version with 'next' tag..."
            npm publish --provenance --access public --tag next || npm publish --access public --tag next
          else
            echo "Publishing stable version..."
            npm publish --provenance --access public || npm publish --access public
          fi

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.package_version.outputs.version }}
        run: |
          # Check if it's a prerelease (contains -rc, -beta, -alpha)
          if [[ "$VERSION" == *"-rc"* ]] || [[ "$VERSION" == *"-beta"* ]] || [[ "$VERSION" == *"-alpha"* ]]; then
            gh release create "v$VERSION" \
              --title "v$VERSION" \
              --notes-file /tmp/release-notes.md \
              --prerelease
          else
            gh release create "v$VERSION" \
              --title "v$VERSION" \
              --notes-file /tmp/release-notes.md \
              --latest
          fi

      - name: Success notification
        if: success()
        env:
          VERSION: ${{ steps.package_version.outputs.version }}
        run: |
          echo "Successfully released v$VERSION"
          echo "NPM: https://www.npmjs.com/package/specweave/v/$VERSION"
          echo "GitHub: https://github.com/anton-abyzov/specweave/releases/tag/v$VERSION"
