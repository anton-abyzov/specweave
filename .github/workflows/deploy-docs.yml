name: Deploy Documentation to GitHub Pages

# NO SECRETS REQUIRED! GitHub Pages uses automatic GITHUB_TOKEN

on:
  push:
    branches: [develop]
    paths:
      - 'docs-site/**'
      - '.specweave/docs/public/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.github/workflows/deploy-docs.yml'

  # Scheduled deployment twice daily (9 AM and 9 PM UTC)
  schedule:
    - cron: '0 9,21 * * *'

  # Allow manual deployment from Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'docs-site/package-lock.json'

      - name: Install dependencies
        run: |
          cd docs-site
          npm ci

      - name: Sync root README to docs-site
        run: |
          # Copy README.md to docs-site as an overview page
          cp README.md docs-site/docs/overview/readme.md
          # Add frontmatter for Docusaurus
          sed -i '1i---\nsidebar_position: 0\ntitle: README\ndescription: SpecWeave project overview from GitHub README\n---\n' docs-site/docs/overview/readme.md
          echo "✅ Synced README.md to docs-site"

      - name: Build documentation
        run: |
          cd docs-site
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'docs-site/build'

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
