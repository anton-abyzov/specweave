# DISABLED 2026-09-02 (supply-chain hardening). Do not move back into .github/workflows/.
#
# Why: the July-2026 injection reached develop through this automation class.
# An agent job ran plain `npm ci` (dependency install scripts enabled), then
# `git add -A && git push` — that is how commit 7e1084e5c (dependabot PR #1912)
# got poisoned with 13 padded-line payload scripts. Dependabot auto-merge then
# carried it in without a human. Policy (SECURITY.md): CI agents never run
# install scripts and never `git add -A`; bot PRs are merged by a person after
# the supply-chain-scan check passes.
#
name: Dependabot Auto-Merge

# Auto-approve and auto-merge Dependabot PRs for minor/patch updates.
# Major updates are auto-approved but require manual merge (may have breaking changes).
#
# REQUIRED REPO SETTINGS (Settings > Actions > General):
#   1. "Allow GitHub Actions to create and approve pull requests" must be ENABLED
#      (without this, the auto-approve step fails with "not permitted to approve")
#   2. "Allow auto-merge" must be ENABLED in Settings > General
#
# Uses --auto flag: merge only happens AFTER all required checks pass.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Auto-approve
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge minor and patch updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
