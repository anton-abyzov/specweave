name: skill-lint

on:
  pull_request:
    paths:
      - 'plugins/specweave/skills/**'
      - 'plugins/specweave/agents/**'
      - 'plugins/specweave/PLUGIN.md'
      - 'plugins/PLUGINS-INDEX.md'
      - 'skills-optional/**'
      - 'scripts/lint-skills.mjs'
      - 'bin/specweave.js'
  push:
    branches: [develop, 'release/**']
    paths:
      - 'plugins/specweave/skills/**'
      - 'plugins/specweave/agents/**'
      - 'plugins/specweave/PLUGIN.md'
      - 'plugins/PLUGINS-INDEX.md'
      - 'skills-optional/**'
      - 'scripts/lint-skills.mjs'
      - 'bin/specweave.js'

jobs:
  lint-skills:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Zero-dependency linter: no install step, so nothing can run a package script here.
      - name: Lint the shipped skill surface
        run: node scripts/lint-skills.mjs
