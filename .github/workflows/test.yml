name: Test & Validate

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - 'docs-site/**'
      - '.specweave/docs/public/**'
      - '**.md'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - 'docs-site/**'
      - '.specweave/docs/public/**'
      - '**.md'
      - '.github/workflows/deploy-docs.yml'

# Prevent duplicate runs - cancel in-progress runs when new commit pushed
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # TEMPORARY: Run only on ubuntu until smoke test is cross-platform
    # Windows bash compatibility issues with mktemp, path handling
    # TODO: Convert smoke-test.sh to Node.js for cross-platform support
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project (clean build)
        run: npm run rebuild

      - name: Verify build output
        shell: bash
        run: |
          # Verify no TypeScript source files in dist/
          if find dist/src -name "*.ts" -not -name "*.d.ts" 2>/dev/null | grep -q .; then
            echo "❌ ERROR: TypeScript source files found in dist/"
            find dist/src -name "*.ts" -not -name "*.d.ts"
            exit 1
          fi
          echo "✅ Build output clean (no .ts source files in dist/)"

      - name: Run unit tests (REQUIRED - must pass)
        run: npm test

      - name: Run integration tests (OPTIONAL - informational only)
        continue-on-error: true
        run: npm run test:integration
        env:
          # GitHub token is auto-provided by Actions (no user input here - safe)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: Set to run real integration tests (creates/deletes test data)
          # Note: These are repository secrets, not user-controlled input
          RUN_INTEGRATION_TESTS: 'false'
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
          AZURE_DEVOPS_ORG: ${{ secrets.AZURE_DEVOPS_ORG }}
          AZURE_DEVOPS_PROJECT: ${{ secrets.AZURE_DEVOPS_PROJECT }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_DOMAIN: ${{ secrets.JIRA_DOMAIN }}

      - name: Check test coverage
        continue-on-error: true
        run: |
          if grep -q '"test:coverage"' package.json; then
            npm run test:coverage
          else
            echo "Test coverage script not configured, skipping"
          fi
        if: matrix.node-version == '20.x'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.node-version == '20.x'
        with:
          file: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella

  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Check skill tests exist (informational)
        continue-on-error: true
        run: |
          echo "Checking for skill test cases..."
          total_skills=0
          skills_with_tests=0

          # Check skills in all plugins
          for skill in plugins/*/skills/*/; do
            if [ -d "$skill" ]; then
              total_skills=$((total_skills + 1))
              skill_name=$(basename "$skill")

              if [ ! -d "$skill/test-cases" ]; then
                echo "⚠️  Missing test-cases in $skill_name"
              else
                test_count=$(find "$skill/test-cases" -name "*.yaml" 2>/dev/null | wc -l)
                if [ $test_count -lt 3 ]; then
                  echo "⚠️  $skill_name has only $test_count test case(s) (minimum 3 recommended)"
                else
                  echo "✓ $skill_name has $test_count test cases"
                  skills_with_tests=$((skills_with_tests + 1))
                fi
              fi
            fi
          done

          echo ""
          echo "Summary: $skills_with_tests/$total_skills skills have adequate test coverage"
          echo "TODO: Add test cases for remaining skills"

  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check required directories
        run: |
          required_dirs=("plugins/specweave" "plugins/specweave-github" ".specweave" "src")
          for dir in "${required_dirs[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "ERROR: Missing required directory: $dir"
              exit 1
            fi
          done

      - name: Validate CLAUDE.md exists
        run: |
          if [ ! -f "CLAUDE.md" ]; then
            echo "ERROR: CLAUDE.md not found"
            exit 1
          fi

      - name: Check increment structure (if any exist)
        run: |
          if [ -d ".specweave/increments" ]; then
            echo "Validating increment structure (informational only)..."
            echo ""

            has_warnings=false

            for increment in .specweave/increments/[0-9][0-9][0-9][0-9]-*/; do
              if [ -d "$increment" ]; then
                increment_name=$(basename "$increment")
                echo "Checking: $increment_name"

                # Check if metadata.json exists to determine increment state
                if [ -f "$increment/metadata.json" ]; then
                  # Extract status from metadata.json (requires jq)
                  if command -v jq >/dev/null 2>&1; then
                    status=$(jq -r '.status // "unknown"' "$increment/metadata.json" 2>/dev/null || echo "unknown")
                  else
                    # Fallback: extract status using grep/sed if jq not available
                    status=$(grep -o '"status"[[:space:]]*:[[:space:]]*"[^"]*"' "$increment/metadata.json" 2>/dev/null | sed 's/.*"\([^"]*\)".*/\1/' || echo "unknown")
                  fi

                  echo "  Status: $status"

                  # Check for standard structure (informational)
                  # Only warn - don't fail the build as increments may be:
                  # - Just created (no spec yet)
                  # - Abandoned (incomplete by design)
                  # - Experimental (non-standard structure)
                  # - Completed with alternative structure
                  if [ ! -f "$increment/spec.md" ]; then
                    if [ "$status" = "active" ]; then
                      echo "  ⚠️  Active increment missing spec.md (may need planning)"
                      has_warnings=true
                    else
                      echo "  ℹ️  No spec.md (OK for $status increments)"
                    fi
                  else
                    echo "  ✓ Has spec.md"
                  fi
                else
                  # No metadata.json - could be legacy or in-progress setup
                  echo "  ⚠️  No metadata.json (legacy or incomplete increment)"
                  has_warnings=true
                  if [ ! -f "$increment/spec.md" ]; then
                    echo "  ⚠️  Also missing spec.md"
                  fi
                fi
                echo ""
              fi
            done

            if [ "$has_warnings" = true ]; then
              echo "⚠️  Some increments have warnings but build continues"
              echo "Note: Warnings don't fail the build - increments may be incomplete by design"
            else
              echo "✅ All increments have valid structure"
            fi
          else
            echo "No increments directory found (OK for new projects)"
          fi

  verify-dev-setup:
    name: Verify Plugin Structure (CI/CD Only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create marketplace symlink (CI/CD testing only - NOT for local dev)
        run: |
          # NOTE: Symlinks are used ONLY in CI/CD for testing (isolated environment)
          # Local development uses GitHub marketplace exclusively (see CLAUDE.md)
          mkdir -p ~/.claude/plugins/marketplaces
          ln -s "$PWD" ~/.claude/plugins/marketplaces/specweave
          echo "✅ CI/CD test symlink created"

      - name: Run dev setup verification
        run: |
          bash scripts/verify-dev-setup.sh
          echo "Note: Marketplace registration check may be skipped in CI/CD"

      - name: Verify hooks are accessible
        run: |
          if [ ! -f ~/.claude/plugins/marketplaces/specweave/plugins/specweave/hooks/post-task-completion.sh ]; then
            echo "❌ ERROR: Hooks not accessible via symlink!"
            exit 1
          fi
          if [ ! -x ~/.claude/plugins/marketplaces/specweave/plugins/specweave/hooks/post-task-completion.sh ]; then
            echo "❌ ERROR: Hooks exist but not executable!"
            exit 1
          fi
          echo "✅ All hooks accessible and executable"

  test-structure:
    name: Validate Test Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check for flat test structure
        run: |
          echo "Checking for flat test structure in tests/integration/..."
          FLAT_DIRS=$(find tests/integration -maxdepth 1 -type d \
            ! -name "integration" \
            ! -name "core" \
            ! -name "features" \
            ! -name "external-tools" \
            ! -name "generators" \
            ! -name "commands" \
            ! -name "deduplication" \
            ! -name "jira" \
            ! -name "fixtures" \
            ! -name "performance" \
            ! -name "stress" \
            ! -name "living-docs" \
            ! -name "cli" \
            ! -name "hooks" \
            ! -name "cache" \
            ! -name "sync" \
            ! -name "ado" \
            ! -name "integrations" \
            ! -name "agents" \
            ! -name "migration" \
            ! -name "increment" \
            ! -name "test-utils" 2>/dev/null | wc -l)

          if [ "$FLAT_DIRS" -gt 0 ]; then
            echo "❌ ERROR: Flat test structure detected!"
            echo "Found $FLAT_DIRS unauthorized directories."
            echo "Tests must be in allowed categories (see .github/workflows/test.yml)"
            find tests/integration -maxdepth 1 -type d \
              ! -name "integration" \
              ! -name "core" \
              ! -name "features" \
              ! -name "external-tools" \
              ! -name "generators" \
              ! -name "commands" \
              ! -name "deduplication" \
              ! -name "jira" \
              ! -name "fixtures" \
              ! -name "performance" \
              ! -name "stress" \
              ! -name "living-docs" \
              ! -name "cli" \
              ! -name "hooks" \
              ! -name "cache" \
              ! -name "sync" \
              ! -name "ado" \
              ! -name "integrations" \
              ! -name "agents" \
              ! -name "migration" \
              ! -name "increment" \
              ! -name "test-utils"
            exit 1
          fi
          echo "✅ Test structure is categorized (no flat directories)"

      - name: Check for unsafe process.cwd() patterns
        run: |
          echo "Checking for unsafe process.cwd() usage in tests..."
          # Exclude: comments, test descriptions, assertions, parameters, path building
          # Focus on actual unsafe patterns like: const dir = process.cwd() + '/.specweave'
          violations=$(grep -r "process\.cwd()" tests/ --include="*.test.ts" 2>/dev/null | \
            grep -v "^\s*//" | \
            grep -v "// .*process\.cwd()" | \
            grep -v "'.*process\.cwd().*'" | \
            grep -v "\".*process\.cwd().*\"" | \
            grep -v "it(" | \
            grep -v "describe(" | \
            grep -v "expect(" | \
            grep -v "\.toBe(process\.cwd())" | \
            grep -v "Mock process\.cwd()" | \
            grep -v "= process\.cwd()" | \
            grep -v "path\.join(process\.cwd()" | \
            grep -v "(process\.cwd())" | \
            grep -v "process\.cwd()," || true)

          if [ -n "$violations" ]; then
            echo "❌ ERROR: Unsafe process.cwd() found in tests!"
            echo "This can cause catastrophic .specweave/ deletion."
            echo "Use createIsolatedTestDir() instead. See CLAUDE.md"
            echo ""
            echo "Violations:"
            echo "$violations" | head -20
            exit 1
          fi
          echo "✅ No unsafe process.cwd() patterns"

      - name: Check E2E naming convention
        run: |
          echo "Checking E2E test naming convention..."
          if find tests/e2e -name "*.spec.ts" 2>/dev/null | grep -q .; then
            echo "❌ ERROR: .spec.ts files found in E2E tests!"
            echo "All E2E tests must use .test.ts extension."
            echo ""
            echo "Violations:"
            find tests/e2e -name "*.spec.ts"
            exit 1
          fi
          echo "✅ All E2E tests use .test.ts naming"

      - name: Verify test isolation utilities exist
        run: |
          if [ ! -f "tests/test-utils/isolated-test-dir.ts" ]; then
            echo "❌ ERROR: Test isolation utilities missing!"
            echo "Required: tests/test-utils/isolated-test-dir.ts"
            exit 1
          fi
          echo "✅ Test isolation utilities present"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run ESLint (if configured)
        run: |
          if grep -q '"lint"' package.json; then
            npm run lint
          else
            echo "Lint script not configured, skipping"
          fi

      - name: Check markdown formatting (if configured)
        run: |
          if grep -q '"lint:md"' package.json; then
            npm run lint:md
          else
            echo "Markdown lint script not configured, skipping"
          fi

  # ============================================================
  # Auto-Fix: Create issue for @claude when CI fails
  # ============================================================
  notify-failure:
    name: Create Auto-Fix Issue
    runs-on: ubuntu-latest
    # Run after ALL other jobs, only if ANY failed
    needs: [test, validate-skills, validate-structure, verify-dev-setup, test-structure, lint]
    if: failure() && github.event_name == 'push'

    permissions:
      issues: write

    steps:
      - name: Create or update auto-fix issue
        uses: actions/github-script@v7
        with:
          script: |
            const branch = '${{ github.ref_name }}';
            const sha = '${{ github.sha }}';
            const runId = '${{ github.run_id }}';
            const runUrl = `https://github.com/${{ github.repository }}/actions/runs/${runId}`;
            const actor = '${{ github.actor }}';

            // Check if an auto-fix issue already exists for this commit
            const { data: existingIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 50
            });

            const existingIssue = existingIssues.find(issue =>
              issue.title.includes('[CI-Fix]') &&
              issue.body && issue.body.includes(sha)
            );

            if (existingIssue) {
              console.log(`Issue already exists: #${existingIssue.number}`);
              // Add comment about this run
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `🔄 CI still failing: [Run #${runId}](${runUrl})`
              });
              return;
            }

            // Get existing labels (don't fail if they don't exist)
            const labels = [];
            for (const name of ['bug', 'ci']) {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name });
                labels.push(name);
              } catch (e) { /* label doesn't exist */ }
            }

            // Create new issue
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[CI-Fix] Test & Validate failed on ${branch}`,
              body: `## CI Failure Detected

@claude Please analyze this CI failure and create a fix.

### Details
| Field | Value |
|-------|-------|
| **Branch** | \`${branch}\` |
| **Commit** | [\`${sha.slice(0,7)}\`](https://github.com/${{ github.repository }}/commit/${sha}) |
| **Run** | [#${runId}](${runUrl}) |
| **Triggered by** | @${actor} |

### Instructions
1. Click the **Run** link above to view failure logs
2. Identify the root cause
3. Create a PR with the fix

---
*Auto-generated by Test & Validate workflow*`,
              labels: labels.length > 0 ? labels : undefined
            });

            console.log(`Created issue #${issue.number}`);
            core.notice(`Created auto-fix issue #${issue.number}`);
