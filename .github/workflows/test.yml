name: Test & Validate

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Debug info
        run: |
          echo "=== Environment ==="
          echo "Node version: $(node -v)"
          echo "NPM version: $(npm -v)"
          echo "Working directory: $(pwd)"
          echo "=== Files ==="
          ls -la
          echo "=== package.json exists? ==="
          test -f package.json && echo "YES" || echo "NO"
          echo "=== package-lock.json exists? ==="
          test -f package-lock.json && echo "YES" || echo "NO"

      - name: Install (verbose)
        run: npm install --ignore-scripts --loglevel verbose 2>&1 | head -100

      - name: Build project
        run: npm run rebuild

      - name: Run smoke tests
        run: npm test
