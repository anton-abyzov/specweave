name: Test & Validate

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Verify setup
        run: |
          echo "Node: $(node -v)"
          echo "NPM: $(npm -v)"
          echo "Files: $(ls -la | head -10)"
          echo "CI test passed - npm install skipped for diagnosis"
