name: Test & Validate

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - 'docs-site/**'
      - '.specweave/docs/public/**'
      - '**.md'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - 'docs-site/**'
      - '.specweave/docs/public/**'
      - '**.md'
      - '.github/workflows/deploy-docs.yml'

# Prevent duplicate runs - cancel in-progress runs when new commit pushed
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build project
        run: npm run rebuild

      - name: Run smoke tests
        run: npm test
