name: Test & Validate

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Prevent duplicate runs
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          # Disabled npm cache to ensure fresh install with new devDependencies
          # cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run rebuild

      - name: Run smoke tests
        run: npm test

      - name: Run unit tests
        run: npm run test:unit
