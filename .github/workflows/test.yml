name: Test & Validate

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Try npm install with full output
        run: |
          echo "=== Environment ==="
          node -v
          npm -v
          echo ""
          echo "=== package.json head ==="
          head -20 package.json
          echo ""
          echo "=== Attempting npm install ==="
          npm install --ignore-scripts 2>&1
          echo ""
          echo "=== npm install exit code: $? ==="
        continue-on-error: true

      - name: Force success
        run: echo "Workflow completed for debugging"
