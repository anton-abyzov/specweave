name: Test & Validate

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Prevent duplicate runs
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          # Disabled npm cache to ensure fresh install with new devDependencies
          # cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Debug environment
        run: |
          echo "Node version: $(node -v)"
          echo "npm version: $(npm -v)"
          echo "TypeScript version: $(npx tsc --version)"
          echo "Checking global.d.ts:"
          ls -la global.d.ts || echo "global.d.ts not found!"
          cat global.d.ts | head -30
          echo "tsconfig.json include:"
          cat tsconfig.json | grep -A 5 '"include"'

      - name: Build project
        run: npm run rebuild

      - name: Run smoke tests
        run: npm test

      - name: Run unit tests
        run: npm run test:unit
