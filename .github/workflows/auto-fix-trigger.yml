name: Auto-Fix Trigger

# Trigger when specific workflows complete
on:
  workflow_run:
    workflows:
      - "Test & Validate"
      - "Release & Publish"
      - "Documentation Build"
      - "Deploy Documentation to GitHub Pages"
      - "SpecWeave E2E Smoke Test"
      - "DORA Metrics"
    types: [completed]

jobs:
  # Quick check job that succeeds immediately if no failure to handle
  check-failure:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check if workflow failed
        id: check
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" = "failure" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "🔴 Triggering workflow failed - will create auto-fix issue"
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "✅ Triggering workflow succeeded - nothing to fix"
          fi

  trigger-autofix:
    needs: check-failure
    if: needs.check-failure.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Ensure required labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const requiredLabels = [
              { name: 'auto-fix', color: '0E8A16', description: 'Automated fix requested' },
              { name: 'workflow-failure', color: 'D73A4A', description: 'CI/CD workflow failure' },
              { name: 'bug', color: 'D73A4A', description: 'Something is not working' }
            ];

            for (const label of requiredLabels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name
                });
                console.log(`✅ Label '${label.name}' exists`);
              } catch (error) {
                if (error.status === 404) {
                  console.log(`Creating label '${label.name}'...`);
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description
                  });
                  console.log(`✅ Created label '${label.name}'`);
                } else {
                  throw error;
                }
              }
            }

      - name: Find or create issue for failed workflow
        uses: actions/github-script@v7
        with:
          script: |
            const workflowName = '${{ github.event.workflow_run.name }}';
            const runNumber = '${{ github.event.workflow_run.run_number }}';
            const runUrl = '${{ github.event.workflow_run.html_url }}';
            const commitSha = '${{ github.event.workflow_run.head_sha }}';
            const branch = '${{ github.event.workflow_run.head_branch }}';

            // Check if issue already exists for this workflow run
            const issueTitle = `[Auto-Fix] ${workflowName} failed (run #${runNumber})`;

            // Search without label filter first (labels might not exist yet)
            const { data: existingIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            const existingIssue = existingIssues.find(issue =>
              issue.title.includes('[Auto-Fix]') &&
              issue.title.includes(workflowName) &&
              issue.title.includes(`run #${runNumber}`)
            );

            if (existingIssue) {
              console.log(`Issue already exists: #${existingIssue.number}`);
              return;
            }

            // Create new issue with @claude mention
            const issueBody = `@claude This workflow failed and needs fixing:

**Workflow**: ${workflowName}
**Run**: #${runNumber}
**Branch**: ${branch}
**Commit**: ${commitSha}
**URL**: ${runUrl}

Please:
1. Analyze the failure logs from the workflow run
2. Identify the root cause
3. Create a PR with a fix

The logs are available at: ${runUrl}

---
*This issue was automatically created by the Auto-Fix Trigger workflow.*`;

            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody,
              labels: ['auto-fix', 'workflow-failure', 'bug']
            });

            console.log(`Created issue #${issue.number} to trigger auto-fix`);

            // Also comment on the commit
            try {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: commitSha,
                body: `🚨 Workflow \`${workflowName}\` failed. Auto-fix triggered in issue #${issue.number}`
              });
            } catch (error) {
              // Commit comment might fail for merge commits, that's OK
              console.log(`Note: Could not add commit comment: ${error.message}`);
            }
