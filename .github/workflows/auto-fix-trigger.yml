name: Auto-Fix Trigger

# Trigger ONLY when Test & Validate completes
# This is the primary quality gate - if it fails, we need to fix
# Other workflow failures (Release, Docs) are handled separately
on:
  workflow_run:
    workflows:
      - "Test & Validate"
    types: [completed]
    branches: [develop, main]

# Prevent multiple auto-fix runs from overlapping
# Cancel in-progress runs when a new one starts for the same branch
concurrency:
  group: auto-fix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  auto-fix:
    # Only run if the triggering workflow failed
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest

    permissions:
      issues: write
      contents: read

    steps:
      - name: Create auto-fix issue
        uses: actions/github-script@v7
        with:
          script: |
            const workflowName = '${{ github.event.workflow_run.name }}';
            const runNumber = '${{ github.event.workflow_run.run_number }}';
            const runUrl = '${{ github.event.workflow_run.html_url }}';
            const commitSha = '${{ github.event.workflow_run.head_sha }}';
            const branch = '${{ github.event.workflow_run.head_branch }}';

            // Check if an auto-fix issue already exists for this commit
            // (prevents duplicate issues if workflow is re-run)
            const { data: existingIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            const existingIssue = existingIssues.find(issue =>
              issue.title.includes('[Auto-Fix]') &&
              issue.body && issue.body.includes(commitSha)
            );

            if (existingIssue) {
              console.log(`✅ Auto-fix issue already exists for commit ${commitSha.slice(0,7)}: #${existingIssue.number}`);

              // Add a comment about this specific run failure
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `🔴 Additional failure detected:\n\n**Workflow**: ${workflowName}\n**Run**: #${runNumber}\n**URL**: ${runUrl}`
              });
              return;
            }

            // Try to get existing labels (don't create new ones - they should exist)
            const labelsToUse = [];
            const possibleLabels = ['bug', 'auto-fix', 'ci-failure'];

            for (const labelName of possibleLabels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelName
                });
                labelsToUse.push(labelName);
              } catch (e) {
                // Label doesn't exist, skip it
                console.log(`Label '${labelName}' not found, skipping`);
              }
            }

            // Create the issue
            const issueBody = `## CI Failure - Needs Investigation

@claude Please analyze this CI failure and suggest a fix.

### Details
| Field | Value |
|-------|-------|
| **Workflow** | ${workflowName} |
| **Run** | [#${runNumber}](${runUrl}) |
| **Branch** | \`${branch}\` |
| **Commit** | \`${commitSha}\` |

### Instructions for @claude
1. Click the run URL above to view the failure logs
2. Identify the root cause of the failure
3. Create a PR with a fix if possible

---
*Auto-generated by CI failure detection*`;

            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Auto-Fix] ${workflowName} failed on ${branch} (${commitSha.slice(0,7)})`,
              body: issueBody,
              labels: labelsToUse.length > 0 ? labelsToUse : undefined
            });

            console.log(`✅ Created auto-fix issue #${issue.number}`);
