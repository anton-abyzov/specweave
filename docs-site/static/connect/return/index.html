<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-dc652kzH4HoIRbxDxHwJpy4smnGFILH6CMxFvyot/oQ='; img-src 'self'; base-uri 'none'; form-action 'none'">
<title>SpecWithCode sign-in</title>
<link rel="icon" href="/favicon.ico">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f7f7f8; color: #18181b; }
  main { max-width: 28rem; padding: 2.5rem 2rem; text-align: center; }
  h1 { font-size: 1.5rem; line-height: 1.3; margin: 0 0 .75rem; }
  p { margin: 0 0 1.5rem; color: #52525b; }
  a.button { display: inline-block; padding: .65rem 1.25rem; border-radius: .5rem;
    background: #2563eb; color: #fff; text-decoration: none; font-weight: 600; }
  a.button[hidden] { display: none; }
  a.button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
  @media (prefers-color-scheme: dark) {
    body { background: #111113; color: #f4f4f5; }
    p { color: #a1a1aa; }
  }
</style>
</head>
<body>
<main>
  <h1 id="title">SpecWithCode sign-in</h1>
  <p id="lead">This page finishes a sign-in started in the SpecWithCode app. Start signing in from the app.</p>
  <a id="open" class="button" href="studio://app/" hidden>Open SpecWithCode</a>
</main>
<script>(function () {
  var query = window.location.search;
  // A bare load, or a refresh after the query was removed, forwards nothing:
  // an empty link could complete a sign-in that is waiting in the app.
  if (!query || query === "?") return;
  var title = document.getElementById("title");
  var lead = document.getElementById("lead");
  var open = document.getElementById("open");
  var params = new URLSearchParams(query);
  // Fixed target: only the scheme, host and path of the SpecWithCode app.
  // Every callback query is forwarded, so one that carries no Clerk field
  // is never stranded; the app ignores a link when no sign-in is waiting.
  var target = "studio://app/" + query;
  var status = params.get("__clerk_status");
  if (status === "failed") {
    title.textContent = "Sign-in did not finish";
    lead.textContent = "Return to SpecWithCode to see why and try again. You can close this tab.";
  } else if (status !== null || params.has("rotating_token_nonce")) {
    title.textContent = "Signed in. Return to SpecWithCode";
    lead.textContent = "SpecWithCode opens now. If it does not, press Open SpecWithCode. You can close this tab.";
  } else {
    title.textContent = "Return to SpecWithCode";
    lead.textContent = "If you started signing in from the SpecWithCode app, press Open SpecWithCode. You can close this tab.";
  }
  open.href = target;
  open.hidden = false;
  // Keep the one-time sign-in code out of the address bar and history.
  try { window.history.replaceState(null, "", window.location.pathname); } catch (e) {}
  window.location.href = target;
})();
</script>
</body>
</html>
