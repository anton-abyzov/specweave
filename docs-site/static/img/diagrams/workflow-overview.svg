  <text x="495" y="70" text-anchor="middle" fill="#6b58b8" font-size="11" font-weight="600">Implement</text>
  <text x="495" y="86" text-anchor="middle" fill="#1a1a2e" font-size="8.5" opacity="0.6">/sw:do</text>

  <line x1="540" y1="73" x2="556" y2="73" stroke="#6b58b8" stroke-width="1.2" marker-end="url(#wf-arrow)"/>

