      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#6b58b8"/>
    </marker>
    <marker id="wf-arrow-accent" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#10b981"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Inter', system-ui, sans-serif; }
