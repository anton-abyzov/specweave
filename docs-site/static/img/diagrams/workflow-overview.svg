  <line x1="495" y1="98" x2="495" y2="130" stroke="#10b981" stroke-width="1.2" stroke-dasharray="5,3"/>

  <!-- TDD cycle box -->
  <rect x="400" y="134" width="190" height="80" rx="10" fill="#10b981" opacity="0.06" stroke="#10b981" stroke-width="1.2"/>
  <text x="495" y="156" text-anchor="middle" fill="#10b981" font-size="11" font-weight="600">TDD Cycle</text>

  <!-- Red -->
  <rect x="414" y="166" width="48" height="24" rx="5" fill="#ef4444" opacity="0.15" stroke="#ef4444" stroke-width="1"/>
  <text x="438" y="182" text-anchor="middle" fill="#ef4444" font-size="9" font-weight="600">Red</text>

  <!-- Arrow -->
  <line x1="462" y1="178" x2="470" y2="178" stroke="#10b981" stroke-width="1" marker-end="url(#wf-arrow-accent)"/>

  <!-- Green -->
  <rect x="474" y="166" width="48" height="24" rx="5" fill="#10b981" opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <text x="498" y="182" text-anchor="middle" fill="#10b981" font-size="9" font-weight="600">Green</text>

  <!-- Arrow -->
  <line x1="522" y1="178" x2="530" y2="178" stroke="#10b981" stroke-width="1" marker-end="url(#wf-arrow-accent)"/>

  <!-- Refactor -->
  <rect x="534" y="166" width="48" height="24" rx="5" fill="#6b58b8" opacity="0.15" stroke="#6b58b8" stroke-width="1"/>
  <text x="558" y="182" text-anchor="middle" fill="#6b58b8" font-size="9" font-weight="600">Refactor</text>
