  <text x="275" y="86" text-anchor="middle" fill="#1a1a2e" font-size="8.5" opacity="0.6">plan.md</text>

  <line x1="320" y1="73" x2="336" y2="73" stroke="#6b58b8" stroke-width="1.2" marker-end="url(#wf-arrow)"/>

