  <text x="165" y="86" text-anchor="middle" fill="#1a1a2e" font-size="8.5" opacity="0.6">spec.md</text>

  <line x1="210" y1="73" x2="226" y2="73" stroke="#6b58b8" stroke-width="1.2" marker-end="url(#wf-arrow)"/>

  <!-- Architect -->
  <rect x="230" y="48" width="90" height="50" rx="8" fill="#6b58b8" opacity="0.08" stroke="#6b58b8" stroke-width="1.2"/>
