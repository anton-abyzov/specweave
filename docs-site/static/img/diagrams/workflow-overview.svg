  <text x="824" y="70" text-anchor="middle" fill="#10b981" font-size="11" font-weight="600">Close</text>
  <text x="824" y="86" text-anchor="middle" fill="#1a1a2e" font-size="8.5" opacity="0.6">/sw:done</text>

