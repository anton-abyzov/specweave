  <text x="715" y="86" text-anchor="middle" fill="#1a1a2e" font-size="8.5" opacity="0.6">/sw:validate</text>

  <line x1="760" y1="73" x2="776" y2="73" stroke="#6b58b8" stroke-width="1.2" marker-end="url(#wf-arrow)"/>

